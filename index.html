<style>
  /* ===== 色と字(全員共通の約束 KYOTSU。ほかの係はこの変数名を使う) ===== */
  :root { color-scheme: light;
    --ink:#5a3d2b; --cream:#fff6e6; --card:#ffffff;
    --gold:#ffd84d; --gold-d:#d9a400; --pink:#ff8fc8; --pink-d:#e0609f; --sky:#8fd3ff; --sky-d:#4fa8d8;
    --leaf:#9be38a; --leaf-d:#5fb84e; --orange:#ffb35c; --orange-d:#e08a2a; --night:#2a1f4a;
    --lav:#e9e0ff; --lav-d:#b3a0e0; --gray:#e8ddd0; --gray-d:#b8a794; --red:#ff6a6a; --red-d:#c62828; --violet:#8a2be2;
    --sun:#ffd84d; /* 古い名前(--sun)も 金色のまま使える */
    --bubble:#fffaf0; --line:#ecd6b8; --sub:#8a6a50;
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
    --fs:20px; --fs2:17px; --fsb:18px; }
  html[data-font="big"] { --fs:24px; --fs2:20px; --fsb:20px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#f3e3c8; color:var(--ink);
    font-family:var(--font);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-text-size-adjust:100%; }
  canvas#game { position:fixed; inset:0; touch-action:none; }
  /* 論理 390×780 の DOM の層。engine.js が canvas と同じ倍率で拡縮する */
  #ui { position:fixed; width:390px; height:780px; left:0; top:0; transform-origin:0 0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .hidden { display:none !important; }
  p { margin:0; line-height:1.6; }

  /* ===== ボタン: ぷにっとした形。影は同じ色の濃い版 ===== */
  button { font:inherit; font-family:var(--font); font-weight:900; font-size:var(--fsb); color:var(--ink); background:var(--gold); border:3px solid var(--ink); border-radius:22px;
    padding:0 14px; min-height:56px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 5px 0 var(--gold-d); line-height:1.2;
    transition:transform .12s cubic-bezier(.3,1.6,.5,1); }
  button:active { transform:scale(.94,.88); transition-duration:.06s; }
  button:disabled { background:#d6cfc6 !important; color:#9a8f84; box-shadow:0 5px 0 #b3a99d !important; border-color:#a89c90; }
  button.sky { background:var(--sky); box-shadow:0 5px 0 var(--sky-d); } button.leaf { background:var(--leaf); box-shadow:0 5px 0 var(--leaf-d); }
  button.orange { background:var(--orange); box-shadow:0 5px 0 var(--orange-d); } button.pink { background:var(--pink); box-shadow:0 5px 0 var(--pink-d); }
  button.lav { background:var(--lav); box-shadow:0 5px 0 var(--lav-d); } button.gray { background:var(--gray); box-shadow:0 5px 0 var(--gray-d); }
  button.small { min-height:44px; font-size:15px; padding:0 10px; }
  .xbtn { position:absolute; right:8px; top:6px; width:52px; height:52px; min-height:52px; padding:0; font-size:24px; background:var(--card); border-radius:50%; z-index:3; box-shadow:0 4px 0 var(--line); }

  /* ===== 上の帯: お金は金色の丸い札、場所は白い札 ===== */
  #hud { position:absolute; left:0; top:0; width:390px; height:52px; background:linear-gradient(rgba(255,246,230,.94),rgba(255,246,230,.86)); border-bottom:3px solid var(--ink); display:flex; align-items:center; justify-content:space-between; padding:0 8px; font-weight:900; }
  #hud .money { font-size:20px; color:var(--ink); background:var(--gold); border:3px solid var(--ink); border-radius:20px; padding:2px 12px 2px 8px; box-shadow:0 3px 0 var(--gold-d); font-variant-numeric:tabular-nums; white-space:nowrap; flex:none; line-height:1.25; display:inline-block; transform-origin:30% 50%; }
  #hud .money.boing { animation:boing .36s cubic-bezier(.3,1.7,.5,1); }
  @keyframes boing { 0% { transform:scale(1); } 40% { transform:scale(1.2); } 100% { transform:scale(1); } }
  #hud .place { font-size:15px; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:3px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:128px; } /* 長い店の名前でお金が2行にならない */
  #hud .place:empty { display:none; }
  #hud .mdiff { position:absolute; left:14px; top:52px; font-size:18px; font-weight:900; text-shadow:0 0 3px #fff, 0 2px 0 #fff; transition:opacity .3s, transform 1.1s; pointer-events:none; }
  /* 下の帯(町) ※中身は係B。土台の色だけ */
  #bottom { position:absolute; left:0; top:628px; width:390px; height:152px; background:var(--cream); border-top:3px solid var(--ink); padding:12px 8px 0; }
  #bottom .row { display:flex; gap:8px; }
  #bottom .row button { flex:1; min-height:64px; padding:0 4px; font-size:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }

  #bottom .tip { margin-top:2px; font-size:16px; color:var(--sub); text-align:center; height:44px; overflow:hidden; line-height:1.3; padding:0 6px; }
  #bottom .stat .gz { color:var(--red-d); }

  /* ===== 会話の窓: 吹き出し(しっぽつき) ===== */
  #dialog { position:absolute; left:8px; bottom:164px; width:374px; min-height:150px; max-height:600px; background:var(--bubble); color:var(--ink); border:3px solid var(--ink); border-radius:24px; padding:10px 16px 14px; z-index:4; box-shadow:0 5px 0 rgba(90,61,43,.25); }
  #dialog::before, #dialog::after { content:''; position:absolute; left:46px; width:0; height:0; border-style:solid; }
  #dialog::before { bottom:-19px; border-width:19px 14px 0 14px; border-color:var(--ink) transparent transparent transparent; }
  #dialog::after { bottom:-14px; left:49px; border-width:16px 11px 0 11px; border-color:var(--bubble) transparent transparent transparent; }
  #dialog.danger { border-color:var(--red-d); box-shadow:0 0 0 4px #ffc9c9, 0 6px 18px rgba(198,40,40,.35); }
  #dialog.danger::before { border-top-color:var(--red-d); }
  #dialog .who { font-size:var(--fs2); color:var(--ink); font-weight:900; display:flex; align-items:center; gap:8px; margin:-2px 0 6px; }
  #dialog .who .face { width:56px; height:56px; flex:none; border-radius:50%; background:#fff; border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:32px; line-height:1; box-shadow:0 3px 0 var(--line); }
  #dialog .who .nm { background:var(--pink); color:#fff; border:3px solid var(--ink); border-radius:18px; padding:3px 14px; text-shadow:0 1px 0 var(--pink-d), 1px 0 0 var(--pink-d), -1px 0 0 var(--pink-d), 0 -1px 0 var(--pink-d); box-shadow:0 3px 0 var(--pink-d); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  #dialog .body { font-size:var(--fs); font-weight:700; line-height:1.6; min-height:64px; white-space:pre-wrap; }
  #dialog .next { position:absolute; right:16px; bottom:8px; color:var(--pink-d); font-size:16px; font-weight:900; animation:hop .7s ease-in-out infinite alternate; }
  @keyframes hop { from { transform:translateY(0); } to { transform:translateY(4px); } }
  #dialog .choices { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  #dialog .choices.two { flex-direction:row; } #dialog .choices button { flex:1; min-height:56px; font-size:var(--fsb); padding:0 8px; }
  @keyframes blink { to { opacity:0; } }

  /* ===== 全面パネル(店・装備・なかま・もちもの・家の中) ===== */
  .panel { position:absolute; left:0; top:52px; width:390px; height:728px; background:var(--cream); color:var(--ink); display:flex; flex-direction:column; z-index:3; }
  .panel.full { top:0; height:780px; }
  .panel .head { padding:8px 72px 6px 14px; min-height:60px; }
  .panel .head h2 { margin:0; font-size:24px; font-weight:900; }
  .panel .head .sub { font-size:15px; color:var(--sub); margin-top:2px; }
  .panel .info { display:flex; justify-content:space-between; padding:0 14px 6px; flex-wrap:wrap; gap:0 10px; font-size:var(--fs2); color:var(--ink); font-weight:900; }
  .panel .list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 8px 8px; }
  .panel .list::-webkit-scrollbar { width:6px; } .panel .list::-webkit-scrollbar-thumb { background:var(--gold-d); border-radius:3px; }
  .row-item { display:flex; align-items:center; gap:10px; min-height:66px; padding:6px 10px; border-radius:18px; margin-bottom:6px; background:var(--card); border:2px solid var(--line); font-weight:800; color:var(--ink); }
  .row-item.sel { background:#fff1b0; border:3px solid var(--ink); box-shadow:0 3px 0 var(--gold-d); }
  .row-item .e { font-size:30px; line-height:1; width:36px; text-align:center; flex:none; }
  .row-item .nm { flex:1; font-size:var(--fs); line-height:1.3; }
  .row-item .nm small { display:block; font-size:14px; font-weight:700; color:var(--sub); }
  .row-item .pr { font-size:var(--fs2); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .row-item .pr.no { color:var(--red-d); }
  .row-item.dim { opacity:.55; }
  .panel .list .sec { font-size:var(--fs2); font-weight:900; color:var(--ink); padding:10px 8px 4px; margin-top:2px; border-bottom:3px dotted var(--gold-d); }
  .up { color:#2e9d4a; } .dn { color:var(--red-d); }
  .panel .roles { padding:0 10px 6px; }
  .roles .chips { display:flex; flex-wrap:wrap; gap:4px 6px; }
  .roles .chip { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:2px 9px; font-size:16px; font-weight:900; white-space:nowrap; }
  .roles .chip b { margin-left:4px; color:#b07a00; font-size:18px; }
  .roles .chip.zero { background:#ffd9d9; border-color:var(--red-d); } .roles .chip.zero b { color:var(--red-d); }
  .roles .warnline { margin-top:5px; padding:5px 10px; background:#ffe3e3; border:2px solid var(--red-d); border-radius:14px; color:#9b1c1c; font-size:16px; font-weight:800; line-height:1.4; }
  .desc { font-size:var(--fs2); font-weight:700; line-height:1.5; padding:6px 12px 10px; color:var(--ink); }
  .panel .foot { display:flex; gap:8px; padding:8px 8px 12px; background:#f6e6cc; border-top:3px solid var(--ink); }
  .panel .foot button { flex:1; min-height:60px; font-size:16px; padding:0 6px; white-space:nowrap; }
  .panel .foot button.lav { flex:0 0 118px; }

  /* ===== 確認の窓 ===== */
  #confirm { position:absolute; left:20px; right:20px; top:200px; background:var(--bubble); color:var(--ink); border:3px solid var(--ink); border-radius:24px; padding:18px 16px 18px; z-index:9; text-align:center; box-shadow:0 6px 0 rgba(90,61,43,.3); }
  #confirm .msg { font-size:var(--fs); font-weight:800; line-height:1.6; margin-bottom:14px; white-space:pre-wrap; }
  #confirm .btns { display:flex; gap:10px; } #confirm .btns button { flex:1; min-height:60px; }
  #shade { position:absolute; inset:0; background:rgba(90,61,43,.45); z-index:8; }

  /* ===== タイトル・おしまい ===== */
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; z-index:5; color:var(--ink); }
  #title.top { justify-content:flex-start; padding-top:262px; gap:12px; }
  #title h1 { margin:0; font-size:40px; font-weight:900; line-height:1.22; color:var(--gold); letter-spacing:1px;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 7px 0 var(--ink); }
  #title h1 .w { display:inline-block; animation:wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform:translateY(4px); } 50% { transform:translateY(-4px); } }
  #title h1 small { display:block; font-size:18px; color:var(--ink); text-shadow:none; margin-top:10px; font-weight:900; letter-spacing:0; }
  #title .catch { font-size:20px; font-weight:900; color:#fff; background:var(--pink); border:3px solid var(--ink); border-radius:20px; padding:4px 16px; box-shadow:0 4px 0 var(--pink-d); transform:rotate(-2deg); text-shadow:0 1px 0 var(--pink-d), 1px 0 0 var(--pink-d), -1px 0 0 var(--pink-d), 0 -1px 0 var(--pink-d); }
  #title .emo { font-size:64px; line-height:1; animation:bob 1.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(0) rotate(-4deg); } to { transform:translateY(-8px) rotate(4deg); } }
  #title button.main { width:300px; min-height:64px; font-size:22px; }
  #title .tools { display:flex; gap:12px; } #title .tools button { width:64px; height:56px; padding:0; font-size:20px; }
  #title .copy { font-size:13px; color:var(--sub); }
  #title p { font-size:var(--fs2); font-weight:800; }

  /* ===== オープニング(絵本) ===== */
  #opening { position:absolute; inset:0; z-index:5; color:var(--ink); text-align:center; }
  #opening .pic { position:absolute; left:0; right:0; top:150px; height:230px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:100px; line-height:1; }
  #opening .pic span { display:inline-block; }
  #opening .pic.pop span { animation:pop .55s cubic-bezier(.3,1.7,.5,1) both, float 1.6s ease-in-out .55s infinite alternate; }
  #opening .pic.pop span:nth-child(2) { animation-delay:.12s, .67s; } #opening .pic.pop span:nth-child(3) { animation-delay:.24s, .79s; }
  @keyframes pop { from { transform:scale(.2) translateY(40px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
  @keyframes float { from { transform:translateY(0) rotate(-3deg); } to { transform:translateY(-8px) rotate(3deg); } }
  #opening .line { position:absolute; left:34px; right:34px; top:440px; min-height:150px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; line-height:1.8; opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s; }
  #opening .line.on { opacity:1; transform:none; }
  #opening .tapnext { position:absolute; right:40px; bottom:96px; color:var(--pink-d); font-size:17px; font-weight:900; animation:hop .7s ease-in-out infinite alternate; }
  #opening .skip { position:absolute; right:14px; top:16px; min-height:48px; font-size:15px; }
  #opening .dots { position:absolute; left:0; right:0; bottom:150px; font-size:14px; letter-spacing:4px; color:var(--gold-d); }

  /* ===== ボス戦(夜の色はここだけ。字は白) ※中身は係D ===== */
  #battle { position:absolute; inset:0; z-index:3; color:#fff; }
  #battle .msg { position:absolute; left:8px; top:430px; width:374px; height:130px; background:rgba(42,31,74,.95); color:#fff; border:3px solid #fff; border-radius:20px; padding:10px 14px; font-size:var(--fs); font-weight:800; line-height:1.55; white-space:pre-wrap; overflow:hidden; }
  #battle .msg .next { position:absolute; right:12px; bottom:6px; color:var(--gold); font-size:15px; animation:blink 1s steps(2) infinite; }
  #battle .cmds { position:absolute; left:8px; top:576px; width:374px; display:flex; gap:6px; }
  #battle .cmds button { flex:1; min-height:64px; font-size:20px; min-width:0; }
  #battle .cmds button.spd { flex:0 0 64px; font-size:14px; background:var(--lav); box-shadow:0 5px 0 var(--lav-d); padding:0 2px; }
  #battle .grid { position:absolute; left:8px; top:650px; width:374px; height:124px; overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:1fr 1fr; gap:6px; align-content:start; padding-right:2px; }
  /* 一覧(へんなこと・たたかう)を開いたら、メッセージ窓を小さくして 一覧を広げる */
  #battle.gridopen .msg { top:430px; height:46px; padding:3px 10px; font-size:15px; line-height:1.25; border-radius:14px; }
  #battle.gridopen .msg .next { bottom:2px; font-size:13px; }
  #battle.gridopen .cmds { top:480px; }
  #battle.gridopen .cmds button { min-height:46px; height:46px; }
  #battle.gridopen .cmds button:not(.spd) .e { display:none; } /* 一覧を開いている間は、大ボタンは「切りかえ」なので 字だけ */
  #battle.gridopen .grid { top:532px; height:246px; gap:5px; }
  #battle.gridopen .grid button { min-height:46px; }
  #battle .grid button.closer { grid-column:1/-1; min-height:34px; height:34px; background:var(--gray); box-shadow:0 4px 0 var(--gray-d); font-size:16px; }
  #battle .grid .sec { grid-column:1/-1; font-size:16px; font-weight:900; color:var(--gold); border-bottom:2px solid rgba(255,216,77,.5); padding:4px 4px 2px; margin-top:2px; }
  #battle .grid::-webkit-scrollbar { width:6px; } #battle .grid::-webkit-scrollbar-thumb { background:var(--gold); border-radius:3px; }
  #battle .grid button { min-height:56px; font-size:16px; text-align:left; padding:0 8px; display:flex; align-items:center; gap:6px; position:relative; border-radius:18px; }

  #battle .guardglow { animation:glow .6s ease-in-out infinite alternate; }

  #battle #confirm, #battle .toast { color:var(--ink); }

  /* ===== 記念写真 ===== */
  #photoui { position:absolute; inset:0; z-index:3; color:var(--ink); }
  #photoui .poses { position:absolute; left:8px; top:558px; width:374px; display:flex; gap:6px; justify-content:space-between; }
  #photoui .poses button { width:56px; height:56px; padding:0; font-size:24px; background:var(--card); box-shadow:0 5px 0 var(--line); border-radius:50%; }
  #photoui .poses button.sel { background:var(--gold); box-shadow:0 5px 0 var(--gold-d), 0 0 0 4px var(--pink); }
  #photoui .acts { position:absolute; left:8px; top:628px; width:374px; display:flex; gap:8px; }
  #photoui .acts button { min-height:64px; white-space:nowrap; padding:0 8px; } #photoui .acts .save { flex:1.4; background:var(--pink); box-shadow:0 5px 0 var(--pink-d); } #photoui .acts .shuf { flex:1; background:var(--lav); box-shadow:0 5px 0 var(--lav-d); font-size:16px; }
  #photoui .end { position:absolute; left:95px; top:708px; width:200px; min-height:56px; background:var(--sky); box-shadow:0 5px 0 var(--sky-d); }
  #photoui .bg { position:absolute; right:8px; top:4px; display:flex; gap:6px; align-items:center; font-weight:900; font-size:16px; }
